name: Build Windows EXE
on:
  push:
    branches: ["capture-frame-v1", "main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file EXE
        run: dotnet publish src/CaptureFrame/CaptureFrame.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptureFrame-win-x64
          path: publish/CaptureFrame.exe
          if-no-files-found: error
          retention-days: 30
